<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- App tile -->
  <rect width="512" height="512" rx="112" ry="112" fill="#0d1117"/>
  <rect x="8" y="8" width="496" height="496" rx="104" ry="104" fill="none" stroke="#30363d" stroke-width="8"/>
  <!-- Terminal inner -->
  <rect x="56" y="96" width="400" height="320" rx="20" ry="20" fill="#161b22" stroke="#21262d" stroke-width="4"/>
  <!-- Title bar dots -->
  <circle cx="92" cy="132" r="10" fill="#484f58"/>
  <circle cx="128" cy="132" r="10" fill="#484f58"/>
  <circle cx="164" cy="132" r="10" fill="#484f58"/>
  <!-- Prompt: paths only, no text fonts (sharp-safe) -->
  <path
    d="M 96 232 L 196 312 L 96 392"
    fill="none"
    stroke="#3fb950"
    stroke-width="40"
    stroke-linecap="round"
    stroke-linejoin="round"/>
  <line x1="96" y1="420" x2="288" y2="420" stroke="#3fb950" stroke-width="36" stroke-linecap="round"/>
  <!-- AI accent orb -->
  <circle cx="372" cy="268" r="56" fill="url(#accent)" filter="url(#glow)" opacity="0.92"/>
  <path
    d="M 340 268 Q 372 220 404 268 Q 372 316 340 268"
    fill="none"
    stroke="#ffffff"
    stroke-width="6"
    stroke-linecap="round"
    opacity="0.35"/>
</svg>
