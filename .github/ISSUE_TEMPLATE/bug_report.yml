name: Bug report
description: Something in AI-SSH-Pro does not behave as expected
title: "bug: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not paste passwords, private keys, API keys, or session exports that contain secrets.
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in Help → About AI-SSH-Pro, or package.json
      placeholder: 0.3.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Terminal lines starting with [main] or [preload], with secrets removed.
      render: text
