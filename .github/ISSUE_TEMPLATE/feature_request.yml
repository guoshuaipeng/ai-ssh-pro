name: Feature request
description: Suggest an improvement to AI-SSH-Pro
title: "feat: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the app do instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This request does not need telemetry, cloud sync, or storing new secrets
          required: true
