name: Release

# Builds installers for Windows / macOS / Linux when a version tag is pushed
# and uploads them to a published GitHub Release for that tag (releaseType: release in package.json).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Unit tests
        run: npm test
      - name: Rebuild native modules for Electron (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder install-app-deps
      - name: Package and upload
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.tar.gz

  notes:
    # R1: publish the release (never leave a draft) with notes taken from CHANGELOG.md
    needs: build
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME}"
          awk -v h="## $v" '$0==h{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > notes.md
          if gh release view "$v" >/dev/null 2>&1; then
            if [ -s notes.md ]; then gh release edit "$v" --notes-file notes.md --draft=false --latest; else gh release edit "$v" --draft=false --latest; fi
          else
            gh release create "$v" --title "$v" --notes-file notes.md --latest
          fi
